name: Installers — Windows and Linux
on:
  push:
    tags: ['v*-preview.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-opencascade mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-catch mingw-w64-ucrt-x86_64-spdlog
            mingw-w64-ucrt-x86_64-nlohmann-json mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-openexr
      - name: Locate Windows toolchain
        shell: msys2 {0}
        run: |
          echo "LMX_TOOL_PREFIX=$(cygpath -w "$MINGW_PREFIX")" >> "$GITHUB_ENV"
      - name: Prepare official bundled Blender with checksum
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $engine = (Get-Content scripts/blender-runtime.json -Raw | ConvertFrom-Json).windows
          New-Item -ItemType Directory -Force build/blender-package/cache | Out-Null
          Invoke-WebRequest -Uri $engine.url -OutFile "build/blender-package/cache/$($engine.filename)"
          & "$env:LMX_TOOL_PREFIX/bin/python.exe" scripts/prepare-blender-runtime.py --platform windows --archive "build/blender-package/cache/$($engine.filename)" --output build-windows-runtime
          if ($LASTEXITCODE) { throw 'Bundled Blender preparation failed' }
      - name: Build and core verification
        shell: msys2 {0}
        run: |
          cmake -S . -B build-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DLMX_DEPLOYMENT_BUILD=ON -DLMX_BLENDER_RUNTIME_DIR="$PWD/build-windows-runtime"
          cmake --build build-windows --parallel 3
          ctest --test-dir build-windows --output-on-failure
      - name: Build setup and verify actual installation
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -BuildDirectory build-windows -ToolPrefix $env:LMX_TOOL_PREFIX -Python "$env:LMX_TOOL_PREFIX/bin/python.exe"
          $setups = @(Get-ChildItem dist/windows/*Setup.exe)
          if ($setups.Count -ne 1) { throw 'Exactly one Windows installer expected.' }
          ./scripts/verify-windows-installer.ps1 -Installer $setups[0].FullName -EvidenceDirectory build-windows/installation-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          compression-level: 0
          path: |
            dist/windows/*Setup.exe
            dist/windows/SHA256SUMS-Windows.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installation-evidence
          path: build-windows/installation-evidence
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/bootstrap.sh
      - name: Build and package
        run: |
          python3 scripts/prepare-blender-runtime.py --platform linux --output build-linux-runtime
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DLMX_DEPLOYMENT_BUILD=ON -DLMX_BLENDER_RUNTIME_DIR="$PWD/build-linux-runtime"
          cmake --build build-linux --parallel 3
          ctest --test-dir build-linux --output-on-failure
          sudo apt-get install -y xvfb libgl1-mesa-dri libxrender1 libxi6 libxxf86vm1 libxfixes3 libxkbcommon0 libegl1 libsm6
          cmake --install build-linux --prefix "$PWD/build-linux/stage"
          QT_QPA_PLATFORM=offscreen ./build-linux/stage/bin/libremax-architect --installation-smoke build-linux/bundled-runtime-evidence
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build-linux/stage/bin/libremax-architect --render-smoke build-linux/bundled-runtime-evidence/render --render-project build-linux/stage/share/libremax/examples/apartamento-moderno.lmx --render-size 320x180 --render-samples 8
          bash scripts/verify-cycles-linux.sh ./build-linux/stage/bin/libremax-architect build-linux/queue-evidence
          cpack --config build-linux/CPackConfig.cmake -G DEB -B dist/linux
          cd dist/linux
          sha256sum *.deb > SHA256SUMS-Linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          compression-level: 0
          path: |
            dist/linux/*.deb
            dist/linux/SHA256SUMS-Linux.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-render-evidence
          path: |
            build-linux/queue-evidence
            build-linux/bundled-runtime-evidence
  linux-installed:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-installer
          path: installer
      - name: Install on a fresh runner with runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ./installer/*.deb xvfb libgl1-mesa-dri
          QT_QPA_PLATFORM=offscreen /usr/bin/libremax-architect --installation-smoke evidence/runtime
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 /usr/bin/libremax-architect --render-smoke evidence/bundled-render --render-project /usr/share/libremax/examples/apartamento-moderno.lmx --render-size 320x180 --render-samples 8
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 /usr/bin/libremax-architect --ui-smoke evidence/expanded-library
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 /usr/bin/libremax-architect --modern-smoke evidence/native
          cp evidence/runtime/portable-project.lmx evidence/preserve-me.lmx
          sudo apt-get remove -y libremax-architect
          test -f evidence/preserve-me.lmx
          test ! -f /usr/bin/libremax-architect
          test ! -f /usr/share/libremax/runtime/blender/blender
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-installation-evidence
          path: evidence
  publish:
    needs: [windows, linux-installed]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          path: release
          merge-multiple: true
      - name: Publish verified preview installers and corresponding application source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git archive --format=tar.gz --prefix=LibreMax-Architect/ --output=release/LibreMax-Architect-Source.tar.gz HEAD
          python3 scripts/prepare-blender-runtime.py --source-only --output release/Blender-4.5.9-Source.tar.xz
          (cd release && sha256sum *.exe *.deb *.tar.gz *.tar.xz > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --prerelease --title "LibreMax Architect $GITHUB_REF_NAME — Instaladores Windows e Linux" --notes-file INSTALADOR/RELEASE_NOTES.md
