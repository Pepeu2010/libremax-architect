name: Native Linux verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Distribution dependencies
        run: bash scripts/bootstrap.sh
      - name: Build
        run: bash scripts/build.sh
      - name: Core geometry persistence library import
        run: bash scripts/test.sh
      - name: Format
        run: |
          python3 -m pip install --user --break-system-packages clang-format==23.1.1
          find apps libs tests -type f \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 "$HOME/.local/bin/clang-format" --dry-run --Werror
      - name: Native UI with Mesa / Xvfb
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/libremax-architect --ui-smoke build/evidence
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/libremax-architect --assembly-smoke build/assembly-evidence
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/libremax-architect --modern-smoke build/modern-evidence
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/libremax-architect --experience-smoke build/experience-evidence
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/libremax-architect --recovery-smoke
      - name: Debian package
        run: cpack --config build/CPackConfig.cmake -G DEB -B dist
      - name: Real Cycles CPU queue and gallery
        timeout-minutes: 15
        run: |
          sudo apt-get install -y libxrender1 libxi6 libxxf86vm1 libxfixes3 libxkbcommon0 libegl1 libsm6
          bash scripts/verify-cycles-linux.sh
      - name: Blender 4.5 LTS compatibility with real CPU renders
        timeout-minutes: 15
        run: |
          bash scripts/verify-cycles-linux.sh ./build/libremax-architect build/compatibility-45-evidence 4.5.9
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/libremax-architect --render-smoke build/compatibility-45-evidence/sky --blender "$PWD/build/blender-runtime/blender-4.5.9-linux-x64/blender" --render-device CPU --render-size 320x180 --render-samples 8 --render-project examples/apartamento-moderno.lmx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-evidence-and-deb
          path: |
            build/evidence
            build/assembly-evidence
            build/modern-evidence
            build/experience-evidence
            build/queue-evidence
            build/compatibility-45-evidence
            dist/*.deb
